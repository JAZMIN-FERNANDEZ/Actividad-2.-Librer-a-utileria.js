<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
    <nav>
        <a href="index.html">← Volver al registro</a>
    </nav>
</header>

<div class="caja">
    <h2>Iniciar sesión</h2>
    <form id="formulario">
        <label for="correo">Correo electrónico</label>
        <input type="text" id="correo" placeholder="Ej. correo@gmail.com">
        <div class="error" id="errorCorreo"></div>

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Tu contraseña">
        <div class="error" id="errorPassword"></div>

        <button type="submit">Iniciar sesión</button>

    </form>
    <div class="resultado" id="resultado"></div>
</div>

<footer>
    Hecho por Jazmín. ING en sistemas computaciones.Programacion Web
</footer>
<script src="js/utileria.js"></script>
<script src="js/Login.js"></script>
</body>
</html>
